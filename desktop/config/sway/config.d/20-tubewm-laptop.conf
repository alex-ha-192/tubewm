# tubewm · laptop and session behaviour.
# Managed by desktop/install.sh, which replaces this file on every update.
# To change something here, override it in a file of your own in this folder
# that sorts later (e.g. 90-mine.conf).

# Lid. Closing it locks the screen, and logind then puts the laptop to sleep.
# With another monitor plugged in, it only turns the laptop screen off and
# carries on (logind doesn't sleep while docked). Opening it turns it back on.
bindswitch --reload --locked lid:on  exec ~/.local/bin/tube-lid close
bindswitch --reload --locked lid:off exec ~/.local/bin/tube-lid open

# Power button: open the power choices instead of switching straight off.
# The inhibitor ends with the session, so the login screen gets the button back.
exec ~/.local/bin/tube-lid power-button
bindsym XF86PowerOff exec ~/.local/bin/tube-status

# First login: a short welcome (colour, keyboard, three tips). Once only.
exec ~/.local/bin/tube-welcome --first-run

# Updates: a quiet notification, at most once a day, when there's a new tubewm.
exec ~/.local/bin/tube-update --notify --delay 90
