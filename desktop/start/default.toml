# tubewm start screen: the layout new users start with.
#
# You don't need to edit this. Arrange your own start screen in place:
# pin apps from the list on the right (right-click > pin to start), drag
# tiles to move them, right-click a tile to resize, recolour, set it up or
# unpin it, and use the + tile to add live tiles. Your layout is saved to
# ~/.config/tubewm/start.json.
#
# App tiles for apps that aren't installed are skipped, so alternatives
# are listed side by side.

[start]
title = "start"

[[tile]]
type = "clock"
size = "wide"

[[tile]]
type = "weather"
size = "medium"

[[tile]]
type = "calendar"
size = "small"

[[tile]]
type = "battery"
size = "small"
color = "dark"

[[tile]]
type = "action"
action = "lock"
size = "small"
color = "dark"

[[tile]]
type = "action"
action = "settings"
size = "small"
color = "dark"

[[tile]]
app = "foot"
label = "terminal"
icon = "terminal"

[[tile]]
type = "music"
size = "medium"

[[tile]]
app = "vivaldi-stable"
label = "vivaldi"
size = "wide"
icon = "web"

[[tile]]
